<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div class="app-shell">
      <button id="themeSettingsBtn" class="theme-btn" type="button" aria-label="Configurações do site">⚙️</button>

      <div id="themeMenu" class="theme-menu hidden">
        <button class="theme-option active" data-theme="dark" type="button">Escuro</button>
        <button class="theme-option" data-theme="blue" type="button">Azul</button>
        <button class="theme-option" data-theme="green" type="button">Verde</button>
        <button class="theme-option" data-theme="purple" type="button">Roxo</button>
      </div>

      <aside id="lobbyPanel" class="panel lobby-panel">
        <div class="brand">
          <span class="brand-mark">◉</span>
          <span>Live Room</span>
        </div>

        <h1>Transmitir e acompanhar em uma sala</h1>

        <form id="lobbyForm" class="lobby-form">
          <label for="userName">Seu nome</label>
          <input id="userName" type="text" maxlength="24" placeholder="Digite seu nome" autocomplete="off" />

          <div class="role-toggle">
            <button type="button" class="role-btn active" data-role="host">Criar sala</button>
            <button type="button" class="role-btn" data-role="viewer">Entrar em uma</button>
          </div>

          <div id="joinRoomField" class="field hidden">
            <label for="roomCodeInput">Código da sala</label>
            <input id="roomCodeInput" type="text" maxlength="8" placeholder="Ex.: A7C9D2" autocomplete="off" />
          </div>

          <button type="submit" class="primary-btn">Entrar na sala</button>
        </form>
      </aside>

      <main class="panel stage-panel">
        <div class="room-content">
          <div id="roomState" class="room-state hidden">
            <div class="room-code-pill">Sala: <strong id="roomCodeLabel">-</strong></div>

            <div class="room-header">
              <div>
                <p id="userStatus" class="user-status">Host</p>
                <h2 id="roomTitle">Sala de transmissão</h2>
              </div>

              <button id="leaveRoomBtn" class="ghost-btn" type="button">Sair da sala</button>
            </div>

            <div class="share-stage">
              <div id="screenPlaceholder" class="screen-placeholder">
                <div class="placeholder-icon">▣</div>
                <p id="screenMessage">Aguardando compartilhamento da tela...</p>
              </div>

              <video id="screenVideo" autoplay playsinline></video>
            </div>

            <div class="stage-actions">
              <button id="shareScreenBtn" class="primary-btn" type="button">Compartilhar tela</button>
              <button id="fullScreenBtn" class="secondary-btn hidden" type="button">Tela cheia</button>
              <button id="stopShareBtn" class="danger-btn hidden" type="button">Parar transmissão</button>
              <button id="leaveRoomBtnSecondary" class="secondary-btn" type="button">Sair da sala</button>
            </div>
          </div>

          <aside id="onlineUsersPanel" class="online-panel hidden">
            <div class="online-header">
              <h3>Usuários online</h3>
              <span id="onlineUsersCount" class="online-count">0</span>
            </div>
            <ul id="onlineUsersList" class="online-list"></ul>
          </aside>
        </div>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
