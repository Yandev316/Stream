<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualização da Sala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #071117;
        --panel: #0d1a25;
        --muted: #8ea6b8;
        --white: #ecf5ff;
        --blue: #7cc9ff;
        --mint: #5ee7c4;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(124, 201, 255, 0.15), transparent 30%), linear-gradient(135deg, #061018 0%, #0a1828 100%);
        color: var(--white);
        font-family: "Inter", sans-serif;
      }

      .viewer-shell {
        width: min(1100px, 92vw);
        min-height: 720px;
        background: rgba(11, 22, 30, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        box-shadow: 0 28px 70px rgba(0,0,0,0.28);
        overflow: hidden;
      }

      .viewer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 22px;
        background: rgba(13, 26, 37, 0.9);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .viewer-header h1 {
        margin: 0;
        font-size: 1.15rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(94, 231, 196, 0.12);
        border: 1px solid rgba(94, 231, 196, 0.3);
        color: var(--mint);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 20px rgba(94, 231, 196, 0.9);
      }

      .screen-container {
        position: relative;
        height: 640px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(15, 29, 43, 0.9), rgba(7, 17, 25, 0.94));
      }

      .screen-placeholder {
        max-width: 560px;
        text-align: center;
        color: var(--muted);
      }

      .viewer-icon {
        font-size: 4rem;
        margin-bottom: 14px;
        color: var(--blue);
      }

      .screen-placeholder h2 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
        color: var(--white);
      }

      .screen-placeholder p {
        margin: 0;
        line-height: 1.6;
      }

      #viewerVideo {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #020d14;
      }
    </style>
  </head>
  <body>
    <div class="viewer-shell">
      <header class="viewer-header">
        <h1 id="roomHeader">Sala: --</h1>
        <div class="status-pill"><span class="status-dot"></span> <span id="liveStatus">Aguardando</span></div>
      </header>

      <main class="screen-container">
        <div id="viewerPlaceholder" class="screen-placeholder">
          <div class="viewer-icon">▣</div>
          <h2>Sem transmissão ativa</h2>
          <p id="viewerMessage">Aguarde a tela ser compartilhada para acompanhar a apresentação.</p>
        </div>

        <video id="viewerVideo" autoplay playsinline></video>
      </main>
    </div>

    <script>
      const channel = new BroadcastChannel("live-room-channel");
      const roomHeader = document.getElementById("roomHeader");
      const liveStatus = document.getElementById("liveStatus");
      const viewerPlaceholder = document.getElementById("viewerPlaceholder");
      const viewerMessage = document.getElementById("viewerMessage");
      const viewerVideo = document.getElementById("viewerVideo");

      const params = new URLSearchParams(window.location.search);
      const roomCode = params.get("room") || "SALA";

      roomHeader.textContent = `Sala: ${roomCode}`;

      function setLiveState(isLive) {
        liveStatus.textContent = isLive ? "Ao vivo" : "Aguardando";
        viewerPlaceholder.style.display = isLive ? "none" : "grid";
        viewerVideo.style.display = isLive ? "block" : "none";
      }

      channel.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.roomCode !== roomCode) {
          return;
        }

        if (data.type === "stream-start") {
          setLiveState(true);
          viewerMessage.textContent = `A transmissão da sala ${roomCode} está ao vivo.`;
        }

        if (data.type === "stream-stop") {
          setLiveState(false);
          viewerMessage.textContent = "A tela foi encerrada. Aguarde o próximo compartilhamento.";
        }
      });

      setLiveState(false);
    </script>
  </body>
</html>
